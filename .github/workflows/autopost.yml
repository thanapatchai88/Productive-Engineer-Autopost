name: autopost

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may delay a few minutes)
  push:
    branches: [main]
    paths: ["queue/**"]
  workflow_dispatch:

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      media_changed: ${{ steps.run.outputs.media_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Post due content
        id: run
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          TT_CLIENT_KEY: ${{ secrets.TT_CLIENT_KEY }}
          TT_CLIENT_SECRET: ${{ secrets.TT_CLIENT_SECRET }}
          TT_REFRESH_TOKEN: ${{ secrets.TT_REFRESH_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
          TT_PRIVACY: ${{ vars.TT_PRIVACY }}
        run: python autopost.py

      - name: Save rotated TikTok refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -f .tt_new_refresh ]; then
            gh secret set TT_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < .tt_new_refresh
            rm .tt_new_refresh
            echo "TikTok refresh token updated"
          fi

      - name: Commit state and media
        if: always()
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add state.json docs/media || true
          if ! git diff --cached --quiet; then
            git commit -m "autopost: update state [skip ci]"
            git pull --rebase
            git push
          fi

  pages:
    needs: post
    if: always() && (needs.post.outputs.media_changed == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
