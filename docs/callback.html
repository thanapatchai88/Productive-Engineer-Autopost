<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TikTok Login Code</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; background: #fff; color: #222; }
  textarea { width: 100%; height: 120px; font-size: 14px; }
  button { margin-top: 8px; padding: 8px 16px; font-size: 16px; }
</style>
</head>
<body>
<h1>TikTok login code</h1>
<p id="msg">คัดลอกโค้ดด้านล่าง แล้ววางในสคริปต์ tiktok_auth.py</p>
<textarea id="code" readonly></textarea>
<button onclick="navigator.clipboard.writeText(document.getElementById('code').value)">คัดลอก</button>
<script>
  const q = new URLSearchParams(location.search);
  const code = q.get("code");
  if (code) {
    document.getElementById("code").value = code;
  } else {
    document.getElementById("msg").textContent = "ไม่พบโค้ด: " + (q.get("error_description") || q.get("error") || "ลองล็อกอินใหม่");
  }
</script>
</body>
</html>
